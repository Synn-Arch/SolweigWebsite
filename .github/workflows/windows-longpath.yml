name: Solweig-Lite and Windows path length

# A student's backend failed with "FileNotFoundError: [Errno 2] No such file or
# directory" on Windows while the baseline worked. This runs the course
# backend's call at several run-folder depths with Windows long paths off (the
# default on a laptop) and then on, to see whether path length is the cause.
on:
  push:
    paths:
      - ".github/scripts/longpath_check.py"
      - ".github/workflows/windows-longpath.yml"
  workflow_dispatch:

jobs:
  longpath:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # setup-miniconda's "conda init" fails on the current Windows image ("needs sudo
      # ... conda.exe"); micromamba builds the same conda-forge environment.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: solweig-light
          create-args: >-
            -c conda-forge python=3.11 gdal=3.13 numpy=2.4 scipy=1.17 numba=0.67 pytz timezonefinder pip
          init-shell: bash

      - name: Install Solweig-Lite like students
        run: |
          pip install --force-reinstall --no-deps https://github.com/Synn-Arch/Solweig-Lite/archive/refs/heads/master.zip
          python -c "import solweig_light._portable; from osgeo import gdal; print('new model ok, gdal', gdal.__version__)"

      - name: Long paths off (a laptop's default)
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 0
          Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled | Select-Object LongPathsEnabled

      - name: Run at several depths, long paths off
        run: python .github/scripts/longpath_check.py web/scene "$RUNNER_TEMP/lp"

      - name: Long paths on
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1
          Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled | Select-Object LongPathsEnabled

      - name: Run at several depths, long paths on
        run: python .github/scripts/longpath_check.py web/scene "$RUNNER_TEMP/lp"
