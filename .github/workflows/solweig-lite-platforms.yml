name: Solweig-Lite on Windows, macOS and Linux

# The course moves from the solweig-light-web.zip release to the Solweig-Lite
# repository, installed from GitHub's download zip. Each OS installs last
# week's zip, tries the unpatched Solweig-Lite zip and records what happens,
# then installs Solweig-Lite with .github/patches/solweig-lite-windows.patch
# applied and runs it like the course backend and like the students' tile
# script.
on:
  push:
    paths:
      - ".github/patches/solweig-lite-windows.patch"
      - ".github/scripts/model_smoke.py"
      - ".github/scripts/solweig_lite_tiles.py"
      - ".github/workflows/solweig-lite-platforms.yml"
  workflow_dispatch:

jobs:
  # Windows cannot check the repository out (tests/ has file names with ':'),
  # so the patched download zip is made once, here, exactly as GitHub's
  # archive link would make it after the patch is merged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Synn-Arch/Solweig-Lite
          ref: master
          path: solweig-lite

      - name: Apply the patch and make the download zip
        run: |
          git -C solweig-lite -c user.name=ci -c user.email=ci@localhost am ../.github/patches/solweig-lite-windows.patch
          git -C solweig-lite log --oneline -3
          git -C solweig-lite archive --prefix=Solweig-Lite-master/ -o "$RUNNER_TEMP/Solweig-Lite-master.zip" HEAD
          python3 - "$RUNNER_TEMP/Solweig-Lite-master.zip" <<'PY'
          import os, sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          bad = [n for n in names if any(c in n for c in ':*?"<>|')]
          print(f"{os.path.getsize(sys.argv[1]):,} bytes, {len(names)} entries, names Windows rejects: {bad}")
          assert not bad
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: solweig-lite-patched
          path: ${{ runner.temp }}/Solweig-Lite-master.zip

  smoke:
    name: ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # The same environment as the course's Week 5 instructions.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: solweig-light
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Create the environment
        run: conda install -y -c conda-forge "gdal>=3.13,<3.14" "numpy=2.4" "scipy=1.17" "numba=0.67" pytz timezonefinder

      - name: Last week's model (the release zip)
        run: |
          pip install --force-reinstall --no-deps https://github.com/Synn-Arch/VIP_2026Fall/releases/download/solweiglight/solweig-light-web.zip
          cd "$RUNNER_TEMP" && python -c "import solweig_light.runtime_phases; print('old website model installed')"

      - name: Unpatched Solweig-Lite straight from GitHub
        id: unpatched
        continue-on-error: true
        run: |
          pip install --force-reinstall --no-deps https://github.com/Synn-Arch/Solweig-Lite/archive/refs/heads/master.zip
          cd "$RUNNER_TEMP" && python -c "import solweig_light.persistence, solweig_light.geometry.service; print('unpatched install and import ok')"

      - uses: actions/download-artifact@v4
        with:
          name: solweig-lite-patched
          path: ${{ runner.temp }}/patched

      - name: Patched Solweig-Lite, installed the same way
        run: |
          pip install --force-reinstall --no-deps "$RUNNER_TEMP/patched/Solweig-Lite-master.zip"
          cd "$RUNNER_TEMP" && python -c "import solweig_light._portable, solweig_light.radiation.static_geometry; print('new model ok')"

      - name: Run it like the course backend
        run: python .github/scripts/model_smoke.py web/scene "$RUNNER_TEMP/smoke"

      - name: Run it like the students' tile script
        run: python .github/scripts/solweig_lite_tiles.py web/scene "$RUNNER_TEMP/tiles"

      - name: Unpatched result
        if: always()
        run: 'echo "Unpatched Solweig-Lite on ${{ matrix.os }}: ${{ steps.unpatched.outcome }}"'
