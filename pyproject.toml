[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solweig-light"
version = "0.1.0.dev0"
description = "CPU-native SOLWEIG implementation under numerical verification"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "numpy>=2.4,<2.5",
  "scipy>=1.17,<1.18",
  "numba>=0.67,<0.68",
  "GDAL>=3.13,<3.14",
  "pytz>=2026.3",
  "timezonefinder>=9,<10",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "build>=1.6"]
forcing = ["xarray>=2026.7,<2027", "pandas>=3,<4", "netCDF4>=1.7,<2", "matplotlib>=3.11,<4", "shapely>=2.1,<3"]
wind = ["rasterio>=1.4,<2", "xarray>=2026.7,<2027", "netCDF4>=1.7,<2"]
inputs = ["pandas>=3,<4", "rasterio>=1.4,<2", "geopandas>=1.1,<2", "fiona>=1.10,<2", "pyproj>=3.7,<4", "shapely>=2.1,<3", "geopy>=2.5,<3", "requests>=2.34,<3", "osmnx", "earthengine-api", "geemap", "xarray>=2026.7,<2027", "netCDF4>=1.7,<2", "cftime>=1.6,<2"]

[project.scripts]
solweig-light = "solweig_light.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solweig_light = ["data/*.txt", "comfort/*.json", "radiation/SLEEF_LICENSE.txt",
                 "backends/native/*.ispc", "backends/native/*.sh",
                 "backends/native/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests/differential", "tests/integration", "tests/unit"]
markers = [
    # Decoder family: run one test with the prepared route left declined
    # (the conftest autouse fixture arms it for everything else).
    "prepared_default_off: exercise the SOLWEIG_LIGHT_PREPARED_VIS default-off contract",
]
